version: 1
setup_command: python -m pip install -e . && python -m pip install pytest
paths:
  '**':
    domains:
    - core
scenarios:
- id: ADOPTED-TEST-001
  cost: medium
  estimated_seconds: 180
  timeout_seconds: 600
  agent_default: true
  scope: integration
  name: Fast representative core regression
  level: integration
  domains:
  - core
  triggers:
  - affected
  platforms:
  - linux
  command: python -m pytest -q tests/test_traffic_profiles.py tests/detection/test_models.py
    tests/execution/test_models.py tests/runtime/test_operational_profiles.py tests/validation/test_path_equality.py
  invariants:
  - representative traffic-profile, model, operational-profile, and path-equality
    regressions remain green
  release_gate: false
- id: ADOPTED-STATIC-001
  cost: cheap
  estimated_seconds: 2
  timeout_seconds: 30
  agent_default: true
  scope: static
  name: Git whitespace validation
  level: static
  domains:
  - core
  triggers:
  - pr
  - preflight
  - release
  platforms:
  - linux
  command: bash -lc 'if [ -n "${ENGINEERING_BASE_REF:-}" ]; then git diff --check
    "${ENGINEERING_BASE_REF}...HEAD"; elif git rev-parse --verify --quiet origin/main
    >/dev/null; then git diff --check origin/main...HEAD; elif git rev-parse --verify
    --quiet main >/dev/null; then git diff --check main...HEAD; elif git rev-parse
    --verify --quiet HEAD^ >/dev/null; then git diff --check HEAD^...HEAD; else git
    diff --check; fi'
  invariants:
  - committed candidate/base diff has no whitespace errors
  release_gate: true
- id: CORE-RELEASE-001
  cost: expensive
  estimated_seconds: 420
  timeout_seconds: 900
  agent_default: false
  scope: integration
  name: Full project regression
  level: integration
  domains:
  - core
  triggers:
  - release
  platforms:
  - linux
  command: python -m pytest -q
  invariants:
  - 'full product regression must pass before release; known failures are tracked
    in issue #5'
  release_gate: true
